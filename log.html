<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Packing Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card log">
    <!-- Tap the logo for the page menu. -->
    <div class="logo-wrap" id="logo-wrap"></div>
    <h1>Operation Christmas Child</h1>
    <p class="sub" id="sub">Packing Log</p>

    <div class="filter">
      <span class="pair"><label for="year-filter">Year</label> <select id="year-filter"></select></span>
      <span class="pair"><label for="church-filter">Show</label> <select id="church-filter"></select></span>
    </div>

    <div id="content"><p class="log-empty">Loading…</p></div>

    <footer>
      <span id="mode"></span>
      <span>Saving the same church and date again updates that row.</span>
    </footer>
  </main>

<script src="common.js"></script>
<script>
(function () {
  var THIS_YEAR = String(new Date().getFullYear());
  var content = document.getElementById("content");
  var modeEl = document.getElementById("mode");
  var yearEl = document.getElementById("year-filter");
  var filterEl = document.getElementById("church-filter");
  var allEntries = [];
  setupLogoMenu(function () { return "log"; });

  // Every year in the log, plus this year, newest first. Opens on this year.
  function fillYears() {
    var chosen = yearEl.value || THIS_YEAR;
    var years = [THIS_YEAR];
    allEntries.forEach(function (e) {
      var y = e.date.slice(0, 4);
      if (years.indexOf(y) < 0) years.push(y);
    });
    years.sort(function (a, b) { return b - a; });
    yearEl.innerHTML = "";
    years.forEach(function (y) { yearEl.appendChild(new Option(y, y)); });
    yearEl.value = years.indexOf(chosen) >= 0 ? chosen : THIS_YEAR;
  }

  // Keep the church filter's options in step with the chosen year's churches.
  function fillFilter(entries) {
    var chosen = filterEl.value;
    var churches = [];
    entries.forEach(function (e) { if (churches.indexOf(e.church) < 0) churches.push(e.church); });
    churches.sort(function (a, b) { return a.localeCompare(b); });
    filterEl.innerHTML = "";
    filterEl.appendChild(new Option("All churches", ""));
    churches.forEach(function (c) { filterEl.appendChild(new Option(c, c)); });
    filterEl.value = churches.indexOf(chosen) >= 0 ? chosen : "";
  }

  function render() {
    fillYears();
    var YEAR = yearEl.value;
    document.getElementById("sub").textContent = "Packing Log " + YEAR;
    var thisYear = allEntries.filter(function (e) { return e.date.slice(0, 4) === YEAR; });
    fillFilter(thisYear);
    var church = filterEl.value;
    var entries = church ? thisYear.filter(function (e) { return e.church === church; }) : thisYear;

    content.innerHTML = "";
    if (!entries.length) {
      content.appendChild(el("p", "log-empty",
        "Nothing logged for " + YEAR + " yet. On the counter page, enter the church and date, then tap Save to log."));
      return;
    }
    entries.sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : a.church.localeCompare(b.church);
    });

    var wrap = el("div", "table-wrap");
    var table = el("table");
    var head = el("tr");
    head.appendChild(el("th", "", "Date"));
    head.appendChild(el("th", "", "Church"));
    head.appendChild(el("th", "num", "Total"));
    head.appendChild(el("th", "", ""));
    var thead = el("thead"); thead.appendChild(head); table.appendChild(thead);

    var tbody = el("tbody");
    var sum = 0;
    entries.forEach(function (e) {
      sum += e.total;
      var tr = el("tr");
      tr.appendChild(el("td", "date", formatDate(e.date, true)));
      tr.appendChild(el("td", "", e.church));
      tr.appendChild(el("td", "num", e.total.toLocaleString()));
      var td = el("td", "del");
      var del = el("button", "link-btn", "Delete");
      del.type = "button";
      del.onclick = function () {
        confirmTap(del, "Tap again", function () {
          api("POST", "api/log/delete", { id: e.id }).then(load).catch(function (err) {
            modeEl.textContent = "⚠ " + err.message;
          });
        });
      };
      td.appendChild(del);
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    // Total line, added automatically for whatever is shown.
    var tfoot = el("tfoot");
    var foot = el("tr");
    var label = el("td", "", (church ? church + " " : "") + YEAR + " total");
    label.colSpan = 2;
    foot.appendChild(label);
    foot.appendChild(el("td", "num", sum.toLocaleString()));
    foot.appendChild(el("td", ""));
    tfoot.appendChild(foot);
    table.appendChild(tfoot);

    wrap.appendChild(table);
    content.appendChild(wrap);
  }

  filterEl.addEventListener("change", render);
  yearEl.addEventListener("change", function () { filterEl.value = ""; render(); });

  function load() {
    return api("GET", "api/log").then(function (d) {
      modeEl.textContent = "● Live";
      allEntries = d.entries;
      render();
    });
  }

  load().catch(function () {
    content.innerHTML = "";
    content.appendChild(el("p", "log-empty",
      "The log needs the server running (node server.js). Open this page from the server's address."));
  });
})();
</script>
</body>
</html>
