<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shoebox Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- Tap the logo for the page menu. Drop a logo.png next to this page to use your own logo. -->
    <div class="logo-wrap" id="logo-wrap"></div>
    <h1>Operation Christmas Child</h1>
    <p class="sub">Shoebox Packing Tracker</p>

    <div class="label"><span class="church" id="church-label"></span> Total Packed</div>
    <div class="total" id="total">0</div>

    <div class="buttons">
      <button class="btn btn-sub" id="minus" aria-label="Subtract one box">− 1</button>
      <button class="btn btn-add" id="plus" aria-label="Add one box">+ 1</button>
    </div>

    <form class="save" id="save-form" autocomplete="off">
      <div class="field wide">
        <label for="church">Church packing</label>
        <input id="church" maxlength="80" placeholder="e.g. Grace Community Church">
      </div>
      <div class="field">
        <label for="date">Date packed</label>
        <input id="date" type="date" required>
      </div>
      <button class="btn btn-save" id="save" type="submit">Save to log</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <footer>
      <span id="mode"></span>
      <button class="link-btn" id="reset" type="button">Reset to 0</button>
    </footer>
  </main>

<script src="common.js"></script>
<script>
(function () {
  var KEY = "occ-shoebox-count";
  var CHURCH_KEY = "occ-church";
  var totalEl = document.getElementById("total");
  var modeEl = document.getElementById("mode");
  var churchEl = document.getElementById("church");
  var churchLabel = document.getElementById("church-label");
  var dateEl = document.getElementById("date");
  var statusEl = document.getElementById("status");
  var count = 0;
  var shared = false; // true when served by server.js (count shared across devices)

  setupLogoMenu(function () { return location.hash === "#tv" ? "tv" : "counter"; });

  function applyTvMode() {
    document.body.classList.toggle("tv", location.hash === "#tv");
  }
  applyTvMode();
  window.addEventListener("hashchange", applyTvMode);

  dateEl.value = todayIso();

  function render(n) {
    if (n !== count) {
      totalEl.classList.add("bump");
      setTimeout(function () { totalEl.classList.remove("bump"); }, 120);
    }
    count = n;
    totalEl.textContent = n.toLocaleString();
  }

  function renderChurch(name) {
    churchLabel.textContent = name;
    // Don't overwrite what someone is typing.
    if (document.activeElement !== churchEl) churchEl.value = name;
  }

  function showStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = "status " + (ok ? "ok" : "err");
  }

  function loadLocal(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function saveLocal(key, v) {
    try { localStorage.setItem(key, v); } catch (e) {}
  }

  function applyState(d) {
    render(d.count);
    renderChurch(d.church || "");
  }

  function change(body) {
    if (shared) {
      api("POST", "api/count", body).then(applyState).catch(function () {
        modeEl.textContent = "⚠ Can't reach server";
      });
    } else {
      var n = body.set !== undefined ? body.set : Math.max(0, count + body.delta);
      saveLocal(KEY, String(n));
      render(n);
    }
  }

  document.getElementById("plus").onclick = function () { change({ delta: 1 }); };
  document.getElementById("minus").onclick = function () { change({ delta: -1 }); };
  document.getElementById("reset").onclick = function () {
    confirmTap(this, "Tap again to reset", function () { change({ set: 0 }); });
  };

  // Church name is shared, so the TV shows it too.
  var churchTimer;
  churchEl.addEventListener("input", function () {
    var name = churchEl.value.trim();
    churchLabel.textContent = name;
    clearTimeout(churchTimer);
    churchTimer = setTimeout(function () {
      if (shared) api("POST", "api/count", { church: name }).catch(function () {});
      else saveLocal(CHURCH_KEY, name);
    }, 500);
  });

  document.getElementById("save-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var church = churchEl.value.trim();
    if (!church) { showStatus("Enter the church name first.", false); churchEl.focus(); return; }
    if (!dateEl.value) { showStatus("Pick the date the boxes were packed.", false); return; }
    if (!shared) { showStatus("Saving to the log needs the server running (node server.js).", false); return; }
    api("POST", "api/log", { church: church, date: dateEl.value, total: count }).then(function (d) {
      showStatus((d.updated ? "Updated: " : "Saved: ") + church + ", " + formatDate(dateEl.value) + ", " +
        count.toLocaleString() + " boxes.", true);
    }).catch(function (err) {
      showStatus("Not saved: " + err.message, false);
    });
  });

  // Keyboard: + / up arrow to add, - / down arrow to subtract (not while typing).
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "+" || e.key === "=" || e.key === "ArrowUp") change({ delta: 1 });
    if (e.key === "-" || e.key === "_" || e.key === "ArrowDown") change({ delta: -1 });
  });

  // Try the shared server first; fall back to saving in this browser.
  api("GET", "api/count").then(function (d) {
    shared = true;
    modeEl.textContent = "● Live — shared across devices";
    applyState(d);
    setInterval(function () {
      api("GET", "api/count").then(function (d) {
        modeEl.textContent = "● Live — shared across devices";
        applyState(d);
      }).catch(function () {
        modeEl.textContent = "⚠ Can't reach server";
      });
    }, 2000);
  }).catch(function () {
    modeEl.textContent = "Saved on this device";
    render(parseInt(loadLocal(KEY), 10) || 0);
    renderChurch(loadLocal(CHURCH_KEY) || "");
  });
})();
</script>
</body>
</html>
